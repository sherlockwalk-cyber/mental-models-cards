<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customer Service Cards</title>
<meta name="description" content="Flash cards for 59 customer service tools and techniques, plus HEARD, LAST and other service frameworks.">
<meta name="theme-color" content="#1F3A3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Service Cards">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#F4F1EB; --surface:#FFFFFF; --ink:#1B2A33; --muted:#5B6B75; --line:#E2DDD3;
  --paper:#FFFFFF; --paper-ink:#1B2A33; --paper-muted:#45545D; --accent:#1F7A6F;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#13181B; --surface:#1D2428; --ink:#ECEFF1; --muted:#A3B0B8; --line:#2D363B; --accent:#4FB3A5; }
}
:root[data-theme="dark"]{ --bg:#13181B; --surface:#1D2428; --ink:#ECEFF1; --muted:#A3B0B8; --line:#2D363B; --accent:#4FB3A5; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}

/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top-row{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{width:34px;height:34px;border-radius:9px}
.brand h1{font-family:var(--serif);font-style:italic;font-weight:700;font-size:21px;margin:0;letter-spacing:.2px}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-style:normal;font-family:var(--sans);font-weight:500}
.search{flex:1 1 220px;max-width:340px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{width:40px;height:40px;padding:0;justify-content:center}

main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}

/* ---------- Four ways ---------- */
.ways{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.way{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.way:hover{border-color:var(--muted)}
.way b{font-family:var(--serif);font-size:17px;font-style:italic}
.way span{font-size:13px;color:var(--muted);line-height:1.35}
@media (max-width:760px){.ways{grid-template-columns:repeat(2,1fr)}}

.progress{display:flex;align-items:center;gap:12px;margin:4px 0 14px;font-size:13.5px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}

/* ---------- Chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600}
.chip i{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- Grid ---------- */
.section-title{font-family:var(--serif);font-style:italic;font-size:20px;margin:22px 0 4px;display:flex;align-items:center;gap:8px}
.section-title svg{width:20px;height:20px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.section-sub{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.mini{position:relative;aspect-ratio:525/700;border-radius:16px;padding:6px;background:var(--c);border:none;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:transform .15s, box-shadow .15s}
.mini:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.mini .in{height:100%;background:var(--paper);color:var(--paper-ink);border-radius:11px;padding:11px 11px 12px;display:flex;flex-direction:column}
.mini .cat{font-family:var(--serif);font-style:italic;font-size:12px;display:flex;align-items:center;gap:5px;color:var(--c)}
.mini .cat svg{width:13px;height:13px}
.mini .art{flex:1;margin:8px 0;border-radius:9px;background:color-mix(in srgb,var(--c) 11%,#fff);display:grid;place-items:center;overflow:hidden}
.mini .art svg{width:44%;height:auto;stroke:var(--c);opacity:.9}
.mini .art img{width:92%}
.mini h3{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.15;margin:0 0 3px}
.mini p{font-size:11.5px;line-height:1.3;color:var(--paper-muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .done{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.mini .done svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

footer.about{max-width:1180px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:12.5px;line-height:1.5}

/* ---------- Viewer ---------- */
.viewer{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 94%,#000);display:none;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom))}
.viewer.open{display:flex}
.v-top{width:100%;max-width:520px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.v-top .count{margin-right:auto;font-size:13.5px;color:var(--muted);font-weight:600}
.hint{font-size:13px;color:var(--muted);min-height:18px;margin:0 0 8px;text-align:center}
.stage{--w:min(420px, calc(100vw - 32px), calc((100dvh - 200px) * 0.62));width:var(--w);height:calc(var(--w) * 1.6);perspective:1600px;touch-action:pan-y;user-select:none;-webkit-user-select:none;flex:0 0 auto}
.drag{width:100%;height:100%;transition:transform .25s ease, opacity .25s}
.drag.dragging{transition:none}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.inner.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);padding:9px;background:var(--c);box-shadow:0 14px 40px rgba(0,0,0,.18)}
.face.back{transform:rotateY(180deg)}
.paper{height:100%;background:var(--paper);color:var(--paper-ink);border-radius:15px;padding:20px 20px 12px;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;margin-right:-8px;padding-right:8px}
.scroll::-webkit-scrollbar{width:4px}.scroll::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}
.f-cat{font-family:var(--serif);font-style:italic;font-size:16px;display:flex;align-items:center;gap:7px;color:var(--c);font-weight:600}
.f-cat svg{width:17px;height:17px}
.f-art{margin:14px 0 14px;border-radius:12px;background:color-mix(in srgb,var(--c) 10%,#fff);aspect-ratio:16/9;display:grid;place-items:center;position:relative;overflow:hidden;flex:0 0 auto}
.f-art svg.big{width:34%;stroke:var(--c);position:relative}
.f-art .ring{position:absolute;border-radius:50%;border:2px dashed color-mix(in srgb,var(--c) 30%,transparent)}
.f-art img{height:96%}
.f-art.tall{aspect-ratio:1/1}
.f-title{font-family:var(--serif);font-weight:500;font-size:clamp(28px,8vw,38px);line-height:1.05;margin:2px 0 10px;letter-spacing:-.3px}
.f-tag{font-family:var(--serif);font-weight:700;font-size:16.5px;line-height:1.3;margin:0 0 10px}
.f-desc{font-family:var(--serif);font-size:15.5px;line-height:1.45;margin:0 0 10px;color:var(--paper-muted)}
.b-title{font-family:var(--serif);font-style:italic;font-weight:700;font-size:23px;margin:0 0 12px}
ol.steps{margin:0;padding-left:22px;font-family:var(--serif);font-size:15px;line-height:1.45}
ol.steps li{margin:0 0 9px;padding-left:3px}
ol.steps li::marker{font-weight:700;color:var(--c)}
.box{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 4px;font-family:var(--serif);font-size:14px;line-height:1.4}
.box h4{margin:0 0 4px;font-family:var(--sans);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--c)}
.box.ex{font-style:italic}
.box.q{background:color-mix(in srgb,var(--c) 8%,#fff);border-color:color-mix(in srgb,var(--c) 28%,#fff);font-style:italic}
h4.sh{margin:0 0 8px;font-family:var(--sans);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--c)}
.box.ins{background:color-mix(in srgb,var(--c) 7%,#fff);border-color:color-mix(in srgb,var(--c) 30%,#fff)}
.rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.clink,.rel button{font-family:var(--serif);font-style:italic;font-weight:700;color:var(--lc,var(--c));text-decoration:none;border-bottom:1.5px solid color-mix(in srgb,var(--lc,var(--c)) 35%,transparent);cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;padding:0}
.rel button{display:inline-flex;align-items:center;gap:5px;border:1.5px solid color-mix(in srgb,var(--lc) 35%,transparent);border-radius:999px;padding:4px 10px;font-size:13.5px}
.rel button svg,.combo svg{width:14px;height:14px;stroke:var(--lc);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.combo{list-style:none;padding:0;margin:6px 0 0}
.combo li{margin:5px 0;display:flex;align-items:center;gap:7px}
.rstep{display:grid;grid-template-columns:1fr 104px;gap:12px;align-items:center;margin:0 0 12px}
.rstep b{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:3px}
.rstep p{margin:0;font-family:var(--serif);font-size:14.5px;line-height:1.4}
.tile{border:none;border-radius:11px;padding:4px;background:var(--lc);aspect-ratio:3/4;text-align:left}
.tile span{display:flex;flex-direction:column;justify-content:space-between;height:100%;background:#fff;color:var(--paper-ink);border-radius:8px;padding:7px}
.tile em{font-family:var(--serif);font-size:10.5px;color:var(--lc)}
.tile svg{width:32px;height:32px;stroke:var(--lc);fill:none;stroke-width:1.8;align-self:center}
.tile strong{font-family:var(--serif);font-size:13px;line-height:1.1;font-weight:600}
.foot{display:flex;justify-content:space-between;font-family:var(--serif);font-style:italic;font-size:11px;color:#8A969D;padding-top:8px;flex:0 0 auto}
.flip-hint{font-family:var(--sans);font-style:normal;font-size:11px;font-weight:600;color:var(--c)}

.v-controls{display:flex;align-items:center;gap:10px;margin-top:14px}
.v-controls .btn{min-width:48px;justify-content:center}
.study-ctl{display:none;gap:10px;margin-top:14px}
.viewer.study .study-ctl{display:flex}
.viewer.study .v-controls{display:none}
.again{background:var(--surface)}
.got{background:var(--accent);color:#fff;border-color:var(--accent)}
.star[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.done-panel{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;max-width:340px;flex:1}
.done-panel h2{font-family:var(--serif);font-style:italic;font-size:28px;margin:0}
.done-panel p{color:var(--muted);margin:0 0 6px}
.viewer.finished .stage,.viewer.finished .study-ctl,.viewer.finished .hint{display:none}
.viewer.finished .done-panel{display:flex}

.menu{position:absolute;right:16px;top:64px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.15);padding:6px;display:none;min-width:200px;z-index:30}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:9px;font-size:14px}
.menu button:hover{background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#installBtn{display:none}
.show-sm{display:none}
@media (max-width:560px){ .brand small{display:none} .show-sm{display:inline} .hide-sm{display:none} .search{order:5;flex-basis:100%;max-width:none} .brand h1{font-size:17px} .brand img{width:30px;height:30px} .top-row{gap:8px} #studyBtn svg{display:none} #studyBtn{padding:9px 12px} }
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <img src="icons/icon-192.png" alt="">
      <div><h1 id="deckName">Customer Service Cards</h1><small id="deckSub"></small></div>
    </div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search techniques…" autocomplete="off" aria-label="Search cards"></label>
    <button class="btn" id="installBtn" title="Install as an app"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="hide-sm">Install</span></button>
    <button class="btn primary" id="studyBtn"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM8 10h8M8 14h5"/></svg>Study</button>
    <button class="btn icon-btn" id="moreBtn" aria-label="More options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  </div>
  <div class="menu" id="menu" role="menu">
    <button data-act="theme">Toggle light / dark</button>
    <button data-act="reset">Reset study progress</button>
  </div>
</header>

<main>
  <section class="ways" aria-label="Ways to get started"></section>

  <div class="progress"><span id="progText">0 mastered</span><div class="bar"><i id="progBar"></i></div></div>
  <nav class="chips" id="chips" aria-label="Filter by category"></nav>
  <div id="list"></div>
</main>

<footer class="about" id="about"></footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Card viewer">
  <div class="v-top">
    <span class="count" id="vCount"></span>
    <button class="btn icon-btn star" id="starBtn" aria-pressed="false" title="Mark as mastered"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button class="btn icon-btn" id="closeBtn" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <p class="hint" id="hint"></p>
  <div class="stage" id="stage"><div class="drag" id="drag"><div class="inner" id="inner"></div></div></div>
  <div class="v-controls">
    <button class="btn" id="prevBtn" aria-label="Previous card"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="btn" id="flipBtn"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/></svg>Flip</button>
    <button class="btn" id="randBtn" aria-label="Random card"><svg viewBox="0 0 24 24"><path d="M4 7h3l10 10h3M4 17h3l3-3M14 10l3-3h3M18 5l2 2-2 2M18 15l2 2-2 2"/></svg></button>
    <button class="btn" id="nextBtn" aria-label="Next card"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="study-ctl">
    <button class="btn again" id="againBtn">Again</button>
    <button class="btn" id="sFlipBtn">Flip</button>
    <button class="btn got" id="gotBtn">Got it</button>
  </div>
  <div class="done-panel" id="donePanel">
    <h2>Deck complete</h2>
    <p id="doneText">You’ve worked through every card in this set.</p>
    <button class="btn primary" id="restartBtn">Study again</button>
    <button class="btn" id="doneClose">Back to cards</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="cards.js"></script>
<script src="app.js"></script>
</body>
</html>
